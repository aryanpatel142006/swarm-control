<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#2a3a7a"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f0a22b"/>
    </radialGradient>
    <radialGradient id="node" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#f5b942"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- spokes: orchestrator to agents -->
  <g stroke="#f5b942" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="118"/>
    <line x1="256" y1="256" x2="376" y2="188"/>
    <line x1="256" y1="256" x2="376" y2="326"/>
    <line x1="256" y1="256" x2="256" y2="394"/>
    <line x1="256" y1="256" x2="136" y2="326"/>
    <line x1="256" y1="256" x2="136" y2="188"/>
  </g>
  <!-- faint ring linking the agents -->
  <circle cx="256" cy="256" r="138" fill="none" stroke="#f5b942" stroke-opacity="0.18" stroke-width="6"/>
  <!-- agent nodes, varied sizes so it reads as a swarm, not a wheel -->
  <circle cx="256" cy="118" r="30" fill="url(#node)"/>
  <circle cx="376" cy="188" r="24" fill="url(#node)"/>
  <circle cx="376" cy="326" r="32" fill="url(#node)"/>
  <circle cx="256" cy="394" r="22" fill="url(#node)"/>
  <circle cx="136" cy="326" r="28" fill="url(#node)"/>
  <circle cx="136" cy="188" r="34" fill="url(#node)"/>
  <!-- hub -->
  <circle cx="256" cy="256" r="58" fill="url(#hub)"/>
  <circle cx="256" cy="256" r="58" fill="none" stroke="#1b2140" stroke-width="8"/>
  <circle cx="256" cy="256" r="22" fill="#1b2140"/>
</svg>
