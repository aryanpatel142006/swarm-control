# swarm-control project config. Committed; both laptops share it.
# Secrets (NOTION_TOKEN, provider keys) live in each laptop's environment. SWARM_HOST names the laptop.
# Notion ids are written to .swarm/notion.yaml by `swarm init`.

project: my-hackathon-project
repo: github-owner/my-hackathon-project
main_branch: main
worktree_root: ../my-hackathon-project-wt   # sibling directory, outside the repo

event:
  start: "2026-10-10T12:00:00-04:00"
  end:   "2026-10-11T12:00:00-04:00"

poll_seconds: 15          # per laptop, all agents in one query; idle_poll_seconds after 5 idle minutes
idle_poll_seconds: 30
heartbeat_seconds: 60
serve_seconds: 30
review_policy: high_and_above   # all | high_and_above | critical_only | none   (switch to `all` at T-4h)
max_review_rounds: 2
max_attempts: 3
heartbeat_stale_minutes: 20   # a laptop's Wi-Fi blip must not get its running tasks reaped (Oct 5 2026)
max_queue_depth: 4        # beyond this, non-critical tasks spill to the next-best agent

verify:
  setup_worktree: scripts/setup_worktree.sh
  fast: scripts/verify_fast.sh      # ≤ 60 s; run after every task
  full: scripts/verify_full.sh      # run by the reviewer
  # Lines a task adds to docs/text files are rejected (Changes Requested, lines named) when they hold a placeholder.
  # Defaults below; [] turns the check off; add "**/*.py" to placeholder_files to check code too (off by default).
  # placeholders: ['\bTBD\b', 'TODO\(fill\)', '\{\{', '<fill', '\bXXX\b', '(?i)\blorem\b']
  # placeholder_files: ['**/*.md', '**/*.markdown', '**/*.rst', '**/*.txt', '**/*.adoc', 'docs/**']
  # Backup/merge leftovers a task must not add (regexes; [] turns it off):
  # stray_files: ['\.[A-Za-z0-9]+-e$', '\.orig$', '\.rej$', '\.bak$', '~$', '\.sw[op]$', '(^|/)\.DS_Store$']

# Environment for every worker CLI and harness-run script; {repo_root} is the main checkout. Point workers at data
# shared across worktrees (fixtures, weights, results) here rather than in a script they must remember to source.
# env:
#   PROJECT_RESULTS_DIR: "{repo_root}/eval/results"
# Directories whose gitignored files (generated clips, stems, weights) the runner symlinks from the main checkout
# into every fresh worktree, file by file, so tracked files there (a committed manifest.json) stay the branch's own.
# worktree_links: [eval/fixtures/demo]

task_limits:   # worker turns never go below 60/100/150 for medium/high/xhigh effort (runner EFFORT_TURN_FLOOR); Codex has no turn limit
  S: { turns: 30,  minutes: 20, budget_usd: 3 }
  M: { turns: 60,  minutes: 40, budget_usd: 8 }
  L: { turns: 120, minutes: 75, budget_usd: 20 }

hosts:   # max_parallel_verify: verify runs at once on that machine (default 2); the rest wait for a slot
  laptop-a: { max_parallel: { claude: 3, codex: 3, gemini: 1, antigravity: 2, grok: 1, generic: 2 }, max_parallel_verify: 2 }
  laptop-b: { max_parallel: { claude: 2, codex: 3, antigravity: 2, perplexity: 1, generic: 2 }, max_parallel_verify: 2 }

routing:
  importance_to_tier: { critical: best, high: high, normal: mid, low: low }
  best_tier_only_when: { importance: critical }     # the `best` tier is never used below critical
  type_model_overrides:
    # Evidence-based exception: WebDev Arena (Sep 25 2026, ~795k votes) ranks Opus 5.5 #1 for frontend,
    # GPT-6 Astra #2, Fable 5.1 #3. So critical frontend runs Opus, and Fable is kept for long-horizon work.
    claude: { frontend: { best: opus, low: sonnet } }   # never Haiku on a page: Roomcast T-013 burned 3 runs at the turn limit

# ---- Toolbox: plugins, skills and MCP servers -------------------------------------------------------------
# `swarm tools --install` sets a laptop up; the runner also installs a task's plugins right before its first
# run, and `swarm doctor` checks them. Names are official-marketplace plugins (`name` = name@claude-plugins-official).
# Cost model (measured): every plugin ENABLED on a laptop adds its skill descriptions to each run, so the runner
# switches off everything not listed here for the run (--settings), which halves a worker's base context.
# plugins_required are enabled everywhere; plugins_by_type may stay disabled globally: the runner loads them
# for that run alone (--plugin-dir). Skills vendored in .claude/skills (TDD, verification, debugging, HF local
# models, transformers.js) load in every run of this repo for both Claude and Codex, no plugin needed.
plugins_required: [frontend-design, context7]    # ~80 tok always-on + the docs-lookup MCP server (used only when named below)
plugins_by_type:
  frontend: [modern-web-guidance, playwright]   # current web-platform practices; browser checks (chromium installed by `swarm tools --install`)

# Skills the worker is told to use before the relevant work (Claude: Skill tool; other CLIs are pointed at .claude/skills/<name>/SKILL.md); Claude also auto-discovers the rest.
skills_by_type:
  frontend: [frontend-design, modern-web-guidance]
  backend:  [test-driven-development]
  ml:       [huggingface-best, huggingface-local-models]
  tests:    [test-driven-development]
skills_by_importance:
  critical: [verification-before-completion]     # no "done" without evidence
  high:     [verification-before-completion]

# MCP servers a run gets (names from `swarm tools`: user-scope `claude mcp list`, servers shipped by installed
# plugins, and mcp_servers below). Off by default; Claude defers tool schemas (tool search) so a server costs
# little context, but Codex loads every tool definition, so keep this to one or two per type.
mcp_by_type:
  frontend: [context7, playwright]   # playwright: the worker checks its own UI in a headless browser
  backend:  [context7]
  ml:       [context7]
  research: [context7]
mcp_by_importance:
  critical: [context7]               # critical work never guesses at an API
mcp_servers:                         # inline definitions win over discovered ones
  playwright: {command: npx, args: ["@playwright/mcp@latest", "--headless", "--isolated"]}
# Codex hosts: register the same names once with `codex mcp add context7 -- npx -y @upstash/context7-mcp`
# (and playwright), set `enabled = false` in ~/.codex/config.toml; the runner enables them per run.

# Critical tasks may also install a further official plugin themselves (the prompt says how) and must log it
# in docs/decisions/<id>.md, so you can promote it to plugins_by_type / skills_by_type for the whole task type.

docs_by_type:               # what gets inlined into a worker's prompt; everything else is referenced by path
  _all:        [PLAN.md#summary, docs/LESSONS.md]   # AGENTS.md is auto-loaded by every CLI; LESSONS.md is what `swarm retro` learned
  frontend:    [docs/DESIGN.md, docs/CONTRACTS.md]
  backend:     [docs/CONTRACTS.md, docs/ARCHITECTURE.md]
  realtime:    [docs/CONTRACTS.md, docs/ARCHITECTURE.md]
  ml_audio:    [docs/ARCHITECTURE.md#ml, docs/CONTRACTS.md#events]
  ml_vision:   [docs/ARCHITECTURE.md#ml, docs/CONTRACTS.md#events]
  ml_fusion:   [docs/ARCHITECTURE.md#ml, docs/CONTRACTS.md#events]
  integration: [docs/ARCHITECTURE.md, docs/CONTRACTS.md]
  eval:        [docs/ARCHITECTURE.md#ml]
  docs:        [docs/ARCHITECTURE.md, docs/DESIGN.md]

# Strength scores (1 weak … 5 strongest) are opinions to edit, seeded from evidence gathered Sep 26 2026:
# - Claude: WebDev Arena #1 (Opus 5.5); practitioner reviews agree on design + multi-file agentic work;
#   Terminal-Bench 2.1 top entry is Fable 5.1 (long-horizon terminal/agentic work).
# - Codex: reviews agree it "does what you said" on backend; strong at PR-review bug catching; GPT-6 Astra #2 on WebDev.
# - Gemini/Antigravity: native video/audio input, cheapest bulk option (3.8 Flash); MLE-bench within 1.3 pts of Opus.
agents:
  claude-a:
    provider: claude
    host: laptop-a
    parallel: 2
    models: { best: fable, high: opus, mid: sonnet, low: haiku }
    effort: { best: high, high: high, mid: medium, low: low }
    strengths: { frontend: 5, backend: 4, realtime: 4, ml_audio: 4, ml_vision: 4, ml_fusion: 4,
                 eval: 4, tests: 4, docs: 5, research: 5, bugfix: 5, integration: 5, infra: 4 }
    soft_cap_5h_usd: 40           # above 80% of this, the agent stops receiving normal/low work
  codex-a:
    provider: codex
    host: laptop-a
    parallel: 2
    models: { best: gpt-6-astra, high: gpt-6-astra, mid: gpt-6-sol, low: gpt-6-luna }
    effort: { best: xhigh, high: high, mid: medium, low: low }
    strengths: { frontend: 3, backend: 5, realtime: 5, ml_audio: 3, ml_vision: 3, ml_fusion: 3,
                 eval: 4, tests: 5, docs: 3, research: 3, bugfix: 4, integration: 4, infra: 5 }
    sandbox: workspace-write      # danger-full-access if tests need network
  gemini-a:                       # Google AI Pro subscription through the Gemini CLI (brew install gemini-cli; log in
    provider: gemini              # once in a real terminal with "Login with Google"). Measured Sep 28 2026: Flash answers in
    host: laptop-a                # 2-5 s, Pro is over quota on the subscription, and the quota runs out after about one
    parallel: 1                   # task per burst (the harness then cools it down 15 min and reroutes). A spare, not a
    models: { best: gemini-3-flash-preview, high: gemini-3-flash-preview, mid: gemini-3-flash-preview, low: gemini-3.1-flash-lite }
    effort: { best: high, high: high, mid: medium, low: low }          # third full worker; a billed GEMINI_API_KEY lifts the quota.
    strengths: { frontend: 2, backend: 3, realtime: 2, ml_audio: 2, ml_vision: 3, ml_fusion: 2,
                 eval: 3, tests: 3, docs: 4, research: 4, bugfix: 2, integration: 2, infra: 2 }
    experimental: true

  codex-b:
    provider: codex
    host: laptop-b
    parallel: 2
    models: { best: gpt-6-astra, high: gpt-6-astra, mid: gpt-6-sol, low: gpt-6-luna }
    effort: { best: xhigh, high: high, mid: medium, low: low }
    strengths: { frontend: 3, backend: 5, realtime: 5, ml_audio: 3, ml_vision: 3, ml_fusion: 3,
                 eval: 4, tests: 5, docs: 3, research: 3, bugfix: 4, integration: 4, infra: 5 }
    sandbox: workspace-write
  agy-b:
    provider: antigravity
    host: laptop-b
    parallel: 1
    models: { best: gemini-3.1-pro, high: gemini-3.1-pro, mid: gemini-3.8-flash, low: gemini-3.8-flash }
    strengths: { frontend: 3, backend: 3, realtime: 2, ml_audio: 3, ml_vision: 4, ml_fusion: 3,
                 eval: 4, tests: 3, docs: 4, research: 4, bugfix: 3, integration: 2, infra: 3 }
    experimental: true            # headless flags are third-party sourced; `swarm doctor --smoke agy-b` must pass
  # perplexity-b:                 # Perplexity agent CLI. Binary, flags and model ids are UNVERIFIED placeholders: set
  #   provider: perplexity        # cli / args_template / approve_args to the real command, then
  #   host: laptop-b              # `swarm doctor --smoke perplexity-b` must pass (README "Perplexity").
  #   parallel: 1
  #   cli: perplexity
  #   args_template: "-p --prompt-file {prompt_file} --model {model} --cwd {cwd} --output-format json"
  #   approve_args: ["--yes"]     # dropped on read-only runs (review, plan)
  #   models: { best: sonar-pro, high: sonar-pro, mid: sonar, low: sonar }
  #   strengths: { frontend: 2, backend: 3, realtime: 2, ml_audio: 2, ml_vision: 2, ml_fusion: 2,
  #                eval: 3, tests: 3, docs: 4, research: 5, bugfix: 2, integration: 2, infra: 2 }
  #   experimental: true

reviewer:                          # a different model family than most authors
  agent: codex-a
  model: gpt-6-sol
  effort: medium
  # while the reviewer's account is rate/usage limited, these review instead (their `mid` model), back to the
  # primary after its reset; default: every other agent of the same provider on the same host; [] = wait instead
  # fallback_agents: [codex-b]
planner:
  agent: claude-a
  model: opus
  effort: high
